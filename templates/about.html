<body>
  <h1>关于本页</h1>
  <p>本页是 Flask 实验中的第二个路由 <code>/about</code>，用来演示一个 Flask 应用可以有多个页面。</p>
  <ul>
    <li><code>/</code>：数据可视化大屏，由 <code>app.py</code> 的 <code>index()</code> 返回</li>
    <li><code>/about</code>：当前页面，由 <code>about()</code> 返回</li>
    <li><code>/api/influenza</code>：返回 JSON 数据，供页面的 ECharts 图表使用</li>
  </ul>
  <p><a href="{{ url_for('index') }}">← 返回数据大屏</a></p>
</body>
